# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the logical secret IDs the enclave requests with
# `runtime.getSecrets([{ id }, { id }])` to the environment variables holding
# their values (simulation: .env; production: Vault DON).
#
# Each value is ONE JSON document (≤ 2 KB per secret, 27 KB total per workflow,
# ≤ 5 secret calls per execution — hence two blobs, not many small keys).
# Schemas: workflow/src/types.ts (providerStrategySchema / makerLimitsSchema).
secretsNames:
    PROVIDER_STRATEGY:
        - SECRET_PROVIDER_STRATEGY
    MAKER_LIMITS:
        - SECRET_MAKER_LIMITS
