name: Builder persistence and wallet sessions

on:
  pull_request:
    paths:
      - 'packages/builder-service/**'
      - 'packages/strategy-builder/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/builder-store.yml'
  push:
    branches: [main]
    paths:
      - 'packages/builder-service/**'
      - 'packages/strategy-builder/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/builder-store.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Official postgres:18.6 multi-platform manifest, verified 2026-09-13.
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: pintool_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pintool_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUILDER_TEST_DATABASE_URL: postgresql://pintool_test:local-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @pintool/builder-service --filter @pintool/strategy-builder
      - run: pnpm typecheck:builder-service
      - run: pnpm test:builder-service
